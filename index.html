<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width= device-width>, initial-scale=1.0" />
    <title>Pizzeria</title>
    <!-- referencia a tipo de letra -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- referencia a pag css -->
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="./img/VectorPizza.png" /> <img src="./img/Pizza&Front.svg" />
      </div>

      <nav class="navegador">
        <div class="itemnav">Home</div>
        <div class="itemnav">Ranking</div>
        <div class="itemnav">Promocion</div>
        <div class="itemnav">Contacto</div>
      </nav>
    </header>
    <main>
      <div class="cajaizquierda"><img src="./img/Delivery.png" /></div>
      <div class="cajaderecha">
        <h2>Podio de pizzas</h2>
        <img src="./img/primeraPizza.png" />
      </div>
      <div class="caja2"></div>
      <div class="caja3"></div>
    </main>
    <footer>
      <nav class="navegadorinferior">
        <div class="itemnav">Home</div>
        <div class="itemnav">Contacto</div>
        <div class="itemnav">Ranking</div>
        <div class="itemnav">Promocion</div>
      </nav>
      <div class="logoinferior">
        <img src="./img/VectorPizza.png" /> <img src="./img/Pizza&Front.svg" />
      </div>
    </footer>
  </body>
</html>
